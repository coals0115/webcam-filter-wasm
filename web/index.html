<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCam Filter WASM - 실시간 웹캠 필터</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 WebCam Filter WASM</h1>
            <p>WebAssembly로 구현한 실시간 웹캠 필터</p>
        </header>

        <main>
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="controls">
                <div class="filter-buttons">
                    <button id="btnNone" class="filter-btn active">원본</button>
                    <button id="btnGrayscale" class="filter-btn">흑백</button>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">처리 시간:</span>
                        <span id="processingTime" class="stat-value">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">FPS:</span>
                        <span id="fps" class="stat-value">-</span>
                    </div>
                </div>
            </div>

            <div id="status" class="status">
                <p>WebAssembly 모듈 로딩 중...</p>
            </div>
        </main>

        <footer>
            <p>C++ + WebAssembly로 구현 | <a href="https://github.com/emscripten-core/emscripten" target="_blank">Emscripten</a></p>
        </footer>
    </div>

    <script src="filters.js"></script>
    <script src="app.js"></script>
</body>
</html>
